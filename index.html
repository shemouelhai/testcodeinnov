<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUPER S.A.M. - COFF MATRICE NATIVE</title>

  <!-- TRANSISTOR-INTERPRÈTE -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const source = document.getElementById('coff-matrix-source');
      if (!source) return;

      const raw = source.textContent;

      // Parseur agnostique d'attributs pour <co>
      const extractNode = (emoji) => {
        // Capture toute balise <co> contenant l'emoji dans son id
        const regex = /<co\b([^>]*)>([\s\S]*?)<\/co>/gi;
        let output = [];
        let match;

        while ((match = regex.exec(raw)) !== null) {
          const attrs = match[1];
          let body = match[2].trim();

          // Vérification que l'ID correspond à l'Emoji ciblé
          if (new RegExp(`id=["']${emoji}-[^"']+["']`, 'i').test(attrs)) {
            if (body.startsWith('[[') && body.endsWith(']]')) {
              body = body.slice(2, -2).trim();
            }
            output.push(body);
          }
        }
        return output.join('\n');
      };

      const css = extractNode('🎨');
      const html = extractNode('🔲');
      const audioJs = extractNode('🎵');
      const touchJs = extractNode('👆');
      const pythonJs = extractNode('⚡');

      // 1. Injection Style
      if (css) {
        const style = document.createElement('style');
        style.textContent = css;
        document.head.appendChild(style);
      }

      // 2. Injection Rendu HTML
      if (html) {
        document.body.insertAdjacentHTML('beforeend', html);
      }

      // 3. Noyau Audio Polyphonique (JNode)
      if (audioJs) {
        const s = document.createElement('script');
        s.textContent = audioJs;
        document.body.appendChild(s);
      }

      // 4. Noyau Tactile & Particules (Transistor Touch)
      if (touchJs) {
        const s = document.createElement('script');
        s.textContent = touchJs;
        document.body.appendChild(s);
      }

      // 5. Noyau Stream Python-JS
      if (pythonJs) {
        const s = document.createElement('script');
        s.textContent = pythonJs;
        document.body.appendChild(s);
      }
    });
  </script>
</head>
<body>

<!-- MATRICE COFF NATIVE (FLUX BRUT) -->
<script type="text/coff-matrix" id="coff-matrix-source">
<coff-matrice-primaire>
  <golem-motor type="Cognitif" etat="true" polarite="Positive">
    <coff-css id="T-CSS">
      <coff-js id="T-JS">
        <python-coff-node id="T-PYTHON">
          <jnode-audio id="T-AUDIO">
            <transistor-touch id="T-TOUCH">
              <transistor-co id="T-CO">

<co id="🎨-c1" target="T-CSS">[[
  * {
    box-sizing: border-box;
  }
  body {
    background-color: #050508;
    margin: 0;
    padding: 0;
    overflow: hidden;
    touch-action: manipulation;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    height: 100dvh;
    gap: 20px;
    user-select: none;
    -webkit-user-select: none;
  }
  .banniere-logo {
    color: #00FFFF;
    font-family: monospace;
    font-size: clamp(1.8rem, 6vw, 3.2rem);
    letter-spacing: 4px;
    text-shadow: 0 0 15px #00FFFF, 0 0 30px #00FFFF, 0 0 50px #FF00FF;
    cursor: pointer;
    text-align: center;
    z-index: 10;
    transition: transform 0.1s ease;
  }
  .banniere-logo:active {
    transform: scale(0.96);
  }
  .btn-activation {
    background: rgba(0, 255, 255, 0.08);
    border: 2px solid #00FFFF;
    color: #00FFFF;
    padding: 12px 26px;
    font-family: monospace;
    font-size: clamp(0.9rem, 3vw, 1.1rem);
    letter-spacing: 2px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.25);
    z-index: 10;
    transition: all 0.2s ease;
  }
  .btn-activation:hover {
    background: rgba(0, 255, 255, 0.2);
    box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
  }
  .btn-activation:active {
    background: #00FFFF;
    color: #000;
  }
  .particule {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99;
  }
]]</co>

<co id="🔲-h1" target="T-CO">[[
  <div class="banniere-logo" id="logo-universe">HELLO UNIVERSE</div>
  <button class="btn-activation" id="btn-react">ACTIVE REACTIONS</button>
]]</co>

<co id="🎵-a1" target="T-AUDIO">[[
  window.audioCtx = null;

  window.jouerSonPulsatif = function() {
    try {
      if (!window.audioCtx) {
        window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (window.audioCtx.state === 'suspended') {
        window.audioCtx.resume();
      }

      const now = window.audioCtx.currentTime;
      const duree = 0.45;

      const grillesAccords = [
        [1.0, 1.20, 1.50],   // Mineur spatial
        [1.0, 1.25, 1.50],   // Majeur brillant
        [1.0, 1.334, 1.50],  // Sus4 cybernétique
        [1.0, 1.50, 2.00]    // Power Chord étendu
      ];

      const accord = grillesAccords[Math.floor(Math.random() * grillesAccords.length)];
      const fondamentale = 180 + Math.random() * 200;
      const textures = ['sawtooth', 'triangle', 'sine'];

      const masterGain = window.audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.25, now);
      masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duree);
      masterGain.connect(window.audioCtx.destination);

      accord.forEach((ratio, index) => {
        const osc = window.audioCtx.createOscillator();
        const detuneCents = (Math.random() - 0.5) * 12;

        osc.type = textures[index % textures.length];
        osc.frequency.setValueAtTime(fondamentale * ratio, now);
        osc.detune.setValueAtTime(detuneCents, now);
        osc.frequency.exponentialRampToValueAtTime(fondamentale * ratio * 0.96, now + duree);

        osc.connect(masterGain);
        osc.start(now);
        osc.stop(now + duree);
      });
    } catch (e) {
      console.warn("[AUDIO COFF] En attente :", e);
    }
  };
]]</co>

<co id="👆-t1" target="T-TOUCH">[[
  window.declencherActionTotale = function(e) {
    if (typeof window.jouerSonPulsatif === 'function') {
      window.jouerSonPulsatif();
    }

    let x = e.clientX;
    let y = e.clientY;

    if ((x === undefined || y === undefined) && e.touches && e.touches.length > 0) {
      x = e.touches[0].clientX;
      y = e.touches[0].clientY;
    } else if (x === undefined || y === undefined) {
      x = window.innerWidth / 2;
      y = window.innerHeight / 2;
    }

    const palette = ['#FF0055', '#00FFCC', '#FFFF00', '#FF00FF', '#00FFFF', '#7000FF', '#FFFFFF'];
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'particule';
      const c = palette[Math.floor(Math.random() * palette.length)];
      p.style.backgroundColor = c;
      p.style.boxShadow = `0 0 12px ${c}, 0 0 24px ${c}`;
      p.style.width = '6px';
      p.style.height = '6px';
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      document.body.appendChild(p);

      const angle = Math.random() * Math.PI * 2;
      const force = 60 + Math.random() * 180;
      const tx = Math.cos(angle) * force;
      const ty = Math.sin(angle) * force;

      p.animate([
        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
      ], {
        duration: 450 + Math.random() * 350,
        easing: 'cubic-bezier(0, .9, .57, 1)'
      }).onfinish = () => p.remove();
    }
  };

  window.addEventListener('pointerdown', (e) => {
    window.declencherActionTotale(e);
  });
]]</co>

<co id="⚡-p1" target="T-PYTHON">[[
  /*
  def process_node_stream(event_active=True):

  const NODE_STREAM_ACTIVE = true;
  console.log("[SUPER S.A.M. COFF KERNEL] Node actif : " + NODE_STREAM_ACTIVE);
]]</co>

              </transistor-co>
            </transistor-touch>
          </jnode-audio>
        </python-coff-node>
      </coff-js>
    </coff-css>
  </golem-motor>
</coff-matrice-primaire>
</script>
