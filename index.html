<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER S.A.M. - COFF MATRICE NATIVE</title>

    <!-- TRANSISTOR-INTERPRÈTE -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const rawContainer = document.getElementById('coff-matrix-source');
            if (!rawContainer) return;

            // Lecture brute du flux COFF sans altération HTML
            const rawData = rawContainer.textContent;

            // Routeur universel par Emoji / ID
            const extractPayload = (emoji) => {
                const regex = new RegExp(`<co\\s+[^>]*id=["']${emoji}-[^"']+["'][^>]*target=["'][^"']+["'][^>]*>([\\s\\S]*?)<\\/co>`, 'gi');
                const matches = [...rawData.matchAll(regex)];
                return matches.map(m => {
                    let body = m[1].trim();
                    if (body.startsWith('[[') && body.endsWith(']]')) {
                        body = body.slice(2, -2).trim();
                    }
                    return body;
                }).join('\n');
            };

            const css = extractPayload('🎨');
            const html = extractPayload('🔲');
            const audioJs = extractPayload('🎵');
            const touchJs = extractPayload('👆');
            const pythonJs = extractPayload('⚡');

            // 1. Déploiement Style CSS
            if (css) {
                const styleTag = document.createElement('style');
                styleTag.textContent = css;
                document.head.appendChild(styleTag);
            }

            // 2. Déploiement Rendu Visuel HTML
            if (html) {
                document.body.insertAdjacentHTML('beforeend', html);
            }

            // 3. Activation Noyau Audio Polyphonique (JNode)
            if (audioJs) {
                const audioScript = document.createElement('script');
                audioScript.textContent = audioJs;
                document.body.appendChild(audioScript);
            }

            // 4. Activation Moteur Tactile / Particules (Transistor Touch)
            if (touchJs) {
                const touchScript = document.createElement('script');
                touchScript.textContent = touchJs;
                document.body.appendChild(touchScript);
            }

            // 5. Activation Noyau Stream Python-JS
            if (pythonJs) {
                const pyScript = document.createElement('script');
                pyScript.textContent = pythonJs;
                document.body.appendChild(pyScript);
            }
        });
    </script>
</head>
<body>

<!-- MATRICE SOURCE ENCAPSULÉE EN TEXTE BRUT -->
<script type="text/coff-matrix" id="coff-matrix-source">
<coff-matrice-primaire>
    <golem-motor type="Cognitif" etat="true" polarite="Positive">
        <coff-css id="T-CSS">
            <coff-js id="T-JS">
                <python-coff-node id="T-PYTHON">
                    <jnode-audio id="T-AUDIO">
                        <transistor-touch id="T-TOUCH">
                            <transistor-co id="T-CO">

                                <co id="🎨-c1" target="T-CSS">[[
                                    body {
                                        background-color: #050508;
                                        margin: 0;
                                        overflow: hidden;
                                        touch-action: manipulation;
                                        display: flex;
                                        flex-direction: column;
                                        justify-content: center;
                                        align-items: center;
                                        height: 100vh;
                                        gap: 24px;
                                        user-select: none;
                                    }
                                    .banniere-logo {
                                        color: #00FFFF;
                                        font-family: monospace;
                                        font-size: 3rem;
                                        letter-spacing: 6px;
                                        text-shadow: 0 0 15px #00FFFF, 0 0 30px #00FFFF, 0 0 50px #FF00FF;
                                        cursor: pointer;
                                        text-align: center;
                                        z-index: 10;
                                        transition: transform 0.1s ease;
                                    }
                                    .banniere-logo:active {
                                        transform: scale(0.95);
                                    }
                                    .btn-activation {
                                        background: rgba(0, 255, 255, 0.08);
                                        border: 2px solid #00FFFF;
                                        color: #00FFFF;
                                        padding: 14px 28px;
                                        font-family: monospace;
                                        font-size: 1.1rem;
                                        letter-spacing: 3px;
                                        border-radius: 8px;
                                        cursor: pointer;
                                        box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
                                        z-index: 10;
                                        transition: all 0.2s ease;
                                    }
                                    .btn-activation:hover {
                                        background: rgba(0, 255, 255, 0.2);
                                        box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
                                    }
                                    .btn-activation:active {
                                        background: #00FFFF;
                                        color: #000;
                                    }
                                    .particule {
                                        position: absolute;
                                        border-radius: 50%;
                                        pointer-events: none;
                                        z-index: 99;
                                    }
                                ]]</co>

                                <co id="🔲-h1" target="T-CO">[[
                                    <div class="banniere-logo" id="logo-universe">HELLO UNIVERSE</div>
                                    <button class="btn-activation" id="btn-react">ACTIVE REACTIONS</button>
                                ]]</co>

                                <co id="🎵-a1" target="T-AUDIO">[[
                                    window.audioCtx = null;

                                    window.jouerSonPulsatif = function() {
                                        try {
                                            if (!window.audioCtx) {
                                                window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                                            }
                                            if (window.audioCtx.state === 'suspended') {
                                                window.audioCtx.resume();
                                            }

                                            const now = window.audioCtx.currentTime;
                                            const duree = 0.45;

                                            // Grilles d'accords harmoniques (Mineur, Majeur, Sus4, Octave)
                                            const grillesAccords = [
                                                [1.0, 1.20, 1.50],   // Accord Mineur spatial
                                                [1.0, 1.25, 1.50],   // Accord Majeur brillant
                                                [1.0, 1.334, 1.50],  // Accord Sus4 cybernétique
                                                [1.0, 1.50, 2.00]    // Power Chord étendu
                                            ];

                                            const accord = grillesAccords[Math.floor(Math.random() * grillesAccords.length)];
                                            const fondamentale = 180 + Math.random() * 200;
                                            const textures = ['sawtooth', 'triangle', 'sine'];

                                            // Bus Master Gain avec atténuation exponentielle
                                            const masterGain = window.audioCtx.createGain();
                                            masterGain.gain.setValueAtTime(0.25, now);
                                            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duree);
                                            masterGain.connect(window.audioCtx.destination);

                                            // Tri-oscillateur avec micro-détuning analogique
                                            accord.forEach((ratio, index) => {
                                                const osc = window.audioCtx.createOscillator();
                                                const detuneCents = (Math.random() - 0.5) * 12;

                                                osc.type = textures[index % textures.length];
                                                osc.frequency.setValueAtTime(fondamentale * ratio, now);
                                                osc.detune.setValueAtTime(detuneCents, now);
                                                osc.frequency.exponentialRampToValueAtTime(fondamentale * ratio * 0.96, now + duree);

                                                osc.connect(masterGain);
                                                osc.start(now);
                                                osc.stop(now + duree);
                                            });

                                        } catch (e) {
                                            console.warn("[AUDIO COFF] En attente de déblocage :", e);
                                        }
                                    };
                                ]]</co>

                                <co id="👆-t1" target="T-TOUCH">[[
                                    window.declencherActionTotale = function(e) {
                                        if (typeof window.jouerSonPulsatif === 'function') {
                                            window.jouerSonPulsatif();
                                        }

                                        let x = e.clientX;
                                        let y = e.clientY;

                                        if (!x && e.touches && e.touches.length > 0) {
                                            x = e.touches[0].clientX;
                                            y = e.touches[0].clientY;
                                        } else if (!x) {
                                            x = window.innerWidth / 2;
                                            y = window.innerHeight / 2;
                                        }

                                        const palette = ['#FF0055', '#00FFCC', '#FFFF00', '#FF00FF', '#00FFFF', '#7000FF', '#FFFFFF'];
                                        for (let i = 0; i < 45; i++) {
                                            const p = document.createElement('div');
                                            p.className = 'particule';
                                            const c = palette[Math.floor(Math.random() * palette.length)];
                                            p.style.backgroundColor = c;
                                            p.style.boxShadow = `0 0 12px ${c}, 0 0 24px ${c}`;
                                            p.style.width = '6px';
                                            p.style.height = '6px';
                                            p.style.left = x + 'px';
                                            p.style.top = y + 'px';
                                            document.body.appendChild(p);

                                            const angle = Math.random() * Math.PI * 2;
                                            const force = 60 + Math.random() * 200;
                                            const tx = Math.cos(angle) * force;
                                            const ty = Math.sin(angle) * force;

                                            p.animate([
                                                { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                                                { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                                            ], {
                                                duration: 500 + Math.random() * 400,
                                                easing: 'cubic-bezier(0, .9, .57, 1)'
                                            }).onfinish = () => p.remove();
                                        }
                                    };

                                    window.addEventListener('pointerdown', (e) => {
                                        window.declencherActionTotale(e);
                                    });
                                ]]</co>

                                <co id="⚡-p1" target="T-PYTHON">[[
                                    /*
                                    def process_node_stream(event_active=True):
                                        while event_active:
                                            emit_multideck_pulse()
                                    */
                                    const NODE_STREAM_ACTIVE = true;
                                    console.log("[SUPER S.A.M. COFF KERNEL] Node prêt et synchronisé : " + NODE_STREAM_ACTIVE);
                                ]]</co>

                            </transistor-co>
                        </transistor-touch>
                    </jnode-audio>
                </python-coff-node>
            </coff-js>
        </coff-css>
    </golem-motor>
</coff-matrice-primaire>
</script>

</body>
</html>
