  <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER S.A.M. - COFF MATRICE AVEC CONNECTEURS XML</title>
    <!-- TRANSISTOR-INTERPRÈTE -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const template = document.getElementById('coff-source');
            if (!template) return;
            const rawData = template.innerHTML;

            // Fonction d'extraction générique par préfixe d'Emoji ID
            const extractNode = (emoji) => {
                const regex = new RegExp(`<co\\s+[^>]*id=["']${emoji}-[^"']+["'][^>]*target=["'][^"']+["'][^>]*>([\\s\\S]*?)<\\/co>`, 'gi');
                return [...rawData.matchAll(regex)].map(m => {
                    let content = m[1].trim();
                    // Nettoyage optionnel des délimiteurs [[ ]] si présents
                    if (content.startsWith('[[') && content.endsWith(']]')) {
                        content = content.slice(2, -2);
                    }
                    return content;
                }).join('\n');
            };

            const css = extractNode('🎨');
            const html = extractNode('🔲');
            const audioJs = extractNode('🎵');
            const touchJs = extractNode('👆');
            const js = extractNode('⚡');

            // 1. Injection CSS
            if (css.trim() !== '') {
                const styleNode = document.createElement('style');
                styleNode.textContent = css;
                document.head.appendChild(styleNode);
            }

            // 2. Injection HTML
            if (html.trim() !== '') {
                document.body.insertAdjacentHTML('beforeend', html);
            }

            // 3. Exécution Audio JNode
            if (audioJs.trim() !== '') {
                const audioScriptNode = document.createElement('script');
                audioScriptNode.textContent = audioJs;
                document.body.appendChild(audioScriptNode);
            }

            // 4. Exécution Transistor Touch
            if (touchJs.trim() !== '') {
                const touchScriptNode = document.createElement('script');
                touchScriptNode.textContent = touchJs;
                document.body.appendChild(touchScriptNode);
            }

            // 5. Exécution Python-JS Node
            if (js.trim() !== '') {
                const scriptNode = document.createElement('script');
                scriptNode.textContent = js;
                document.body.appendChild(scriptNode);
            }
        });
    </script>
</head>
<body>

<template id="coff-source">
<coff-matrice-primaire>
    <golem-motor type="Cognitif" etat="true" polarite="Positive">
        <coff-css id="T-CSS">
            <coff-js id="T-JS">
                <python-coff-node id="T-PYTHON">
                    <jnode-audio id="T-AUDIO">
                        <transistor-touch id="T-TOUCH">
                            <transistor-co id="T-CO">
                                
                                <co id="🎨-c1" target="T-CSS">[[
                                    body {
                                        background-color: #000;
                                        margin: 0;
                                        overflow: hidden;
                                        touch-action: manipulation;
                                        display: flex;
                                        flex-direction: column;
                                        justify-content: center;
                                        align-items: center;
                                        height: 100vh;
                                        gap: 20px;
                                    }
                                    .banniere-logo {
                                        color: #0FF;
                                        font-family: monospace;
                                        font-size: 3.5rem;
                                        letter-spacing: 6px;
                                        text-shadow: 0 0 15px #0FF, 0 0 30px #0FF, 0 0 45px #FF00FF;
                                        user-select: none;
                                        z-index: 10;
                                        text-align: center;
                                        cursor: pointer;
                                    }
                                    .btn-activation {
                                        background: rgba(0, 255, 255, 0.1);
                                        border: 2px solid #0FF;
                                        color: #0FF;
                                        padding: 12px 24px;
                                        font-family: monospace;
                                        font-size: 1.1rem;
                                        letter-spacing: 2px;
                                        border-radius: 8px;
                                        cursor: pointer;
                                        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
                                        z-index: 10;
                                        transition: all 0.2s ease;
                                    }
                                    .btn-activation:active {
                                        background: #0FF;
                                        color: #000;
                                    }
                                    .particule {
                                        position: absolute;
                                        border-radius: 50%;
                                        pointer-events: none;
                                        z-index: 99;
                                    }
                                ]]</co>
                                
                                <co id="🔲-h1" target="T-CO">[[
                                    <div class="banniere-logo" id="logo-universe">HELLO UNIVERSE</div>
                                    <button class="btn-activation" id="btn-react">ACTIVE REACTIONS</button>
                                ]]</co>

                                <co id="🎵-a1" target="T-AUDIO">[[
                                    window.audioCtx = null;

                                    window.jouerSonPulsatif = function() {
                                        try {
                                            if (!window.audioCtx) {
                                                window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                                            }
                                            if (window.audioCtx.state === 'suspended') {
                                                window.audioCtx.resume();
                                            }
                                            const osc = window.audioCtx.createOscillator();
                                            const gain = window.audioCtx.createGain();
                                            
                                            osc.type = 'sawtooth';
                                            osc.frequency.setValueAtTime(250 + Math.random() * 750, window.audioCtx.currentTime);
                                            
                                            gain.gain.setValueAtTime(0.4, window.audioCtx.currentTime);
                                            gain.gain.exponentialRampToValueAtTime(0.001, window.audioCtx.currentTime + 0.3);
                                            
                                            osc.connect(gain);
                                            gain.connect(window.audioCtx.destination);
                                            osc.start();
                                            osc.stop(window.audioCtx.currentTime + 0.3);
                                        } catch (e) {
                                            console.log("Audio en attente.");
                                        }
                                    };
                                ]]</co>

                                <co id="👆-t1" target="T-TOUCH">[[
                                    window.declencherActionTotale = function(e) {
                                        let x = e.clientX || (e.touches && e.touches[0].clientX) || (e.changedTouches && e.changedTouches[0].clientX) || window.innerWidth / 2;
                                        let y = e.clientY || (e.touches && e.touches[0].clientY) || (e.changedTouches && e.changedTouches[0].clientY) || window.innerHeight / 2;
                                        
                                        if (typeof window.jouerSonPulsatif === 'function') {
                                            window.jouerSonPulsatif();
                                        }
                                        
                                        const couleursMulticolores = ['#FF0055', '#00FFCC', '#FFFF00', '#FF00FF', '#00FFFF', '#7000FF', '#FF5500', '#FFFFFF'];
                                        for (let i = 0; i < 50; i++) {
                                            let p = document.createElement('div');
                                            p.className = 'particule';
                                            let c = couleursMulticolores[Math.floor(Math.random() * couleursMulticolores.length)];
                                            p.style.backgroundColor = c;
                                            p.style.boxShadow = `0 0 15px ${c}, 0 0 30px ${c}`;
                                            p.style.width = '6px';
                                            p.style.height = '6px';
                                            p.style.left = x + 'px';
                                            p.style.top = y + 'px';
                                            document.body.appendChild(p);
                                            
                                            let angle = Math.random() * Math.PI * 2;
                                            let force = 80 + Math.random() * 220;
                                            let tx = Math.cos(angle) * force;
                                            let ty = Math.sin(angle) * force;
                                            
                                            p.animate([
                                                { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                                                { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                                            ], {
                                                duration: 600 + Math.random() * 500,
                                                easing: 'cubic-bezier(0, .9, .57, 1)'
                                            }).onfinish = () => p.remove();
                                        }
                                    };

                                    document.addEventListener('pointerdown', (e) => {
                                        window.declencherActionTotale(e);
                                    });
                                ]]</co>

                                <co id="⚡-p1" target="T-PYTHON">[[
                                    /*
                                    def process_node_stream(event_active=True):
                                        while event_active:
                                            emit_multideck_pulse()
                                    */
                                    const NODE_STREAM_ACTIVE = true;
                                    console.log("[SUPER S.A.M. COFF NODE KERNEL] Connecteur validé : " + NODE_STREAM_ACTIVE);
                                ]]</co>

                            </transistor-co>
                        </transistor-touch>
                    </jnode-audio>
                </python-coff-node>
            </coff-js>
        </coff-css>
    </golem-motor>
</coff-matrice-primaire>
</template>

</body>
</html>
