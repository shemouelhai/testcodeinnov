<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SUPER S.A.M. - GOLEMOTOR BOOST PWA & STREAM MATRIX</title>

  <!-- TRANSISTOR-INTERPRÈTE -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const source = document.getElementById('coff-matrix-source');
      if (!source) return;

      const raw = source.textContent;

      const extractNode = (emoji) => {
        const regex = /<co\b([^>]*)>([\s\S]*?)<\/co>/gi;
        let output = [];
        let match;

        while ((match = regex.exec(raw)) !== null) {
          const attrs = match[1];
          let body = match[2].trim();

          if (new RegExp(`id=["']${emoji}-[^"']+["']`, 'i').test(attrs)) {
            if (body.startsWith('[[') && body.endsWith(']]')) {
              body = body.slice(2, -2).trim();
            }
            output.push(body);
          }
        }
        return output.join('\n');
      };

      const css = extractNode('🎨');
      const html = extractNode('🔲');
      const audioJs = extractNode('🎵');
      const touchJs = extractNode('👆');
      const pythonJs = extractNode('⚡');

      if (css) {
        const s = document.createElement('style');
        s.textContent = css;
        document.head.appendChild(s);
      }
      if (html) {
        document.body.insertAdjacentHTML('beforeend', html);
      }
      if (audioJs) {
        const s = document.createElement('script');
        s.textContent = audioJs;
        document.body.appendChild(s);
      }
      if (pythonJs) {
        const s = document.createElement('script');
        s.textContent = pythonJs;
        document.body.appendChild(s);
      }
      if (touchJs) {
        const s = document.createElement('script');
        s.textContent = touchJs;
        document.body.appendChild(s);
      }
    });
  </script>
</head>
<body>

<!-- MATRICE COFF NATIVE DU BOOSTER -->

<co id="🎨-c1" target="T-CSS">[[
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {

    color: #E0F0FF;
    font-family: 'Segoe UI', monospace, system-ui;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 16px;
    gap: 16px;
    user-select: none;
    overflow-x: hidden;
  }

  .header-panel {
    text-align: center;
    display: flex;

  }
  .tag {

    letter-spacing: 3px;
    color: #00FFCC;
  }
  .title {

    font-weight: 800;
    letter-spacing: 6px;
    text-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
  }

  /* Viewport Vidéo / Stream Filtré */
  .viewport-container {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 2px solid rgba(0, 255, 204, 0.4);

  }
  #stream-canvas {

  }

    letter-spacing: 1px;
    color: #00FFCC;

  }
  .stream-fps-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid #FF0077;
    border-radius: 6px;

  /* Commandes & Filtres */

  .btn-filter {

  }
  .btn-filter.active {

    border-color: #00FFCC;
    color: #FFFFFF;
    box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
  }

  /* Moniteur de Télémétrie PWA */

    background: rgba(8, 12, 22, 0.85);
    border: 1px solid rgba(0, 255, 204, 0.2);

  }
  .val-active { color: #00FF66; font-weight: bold; }

    padding: 8px 12px;
    font-size: 0.75rem;
    color: #E0FFFF;
    text-align: center;
    width: 100%;
    max-width: 480px;
  }
]]</co>

<co id="🎵-a1" target="T-AUDIO">[[
  window.audioCtx = null;

  window.jouerSonBoost = function(type = 'filter') {
    try {
      if (!window.audioCtx) window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (window.audioCtx.state === 'suspended') window.audioCtx.resume();

      const now = window.audioCtx.currentTime;
      const osc = window.audioCtx.createOscillator();
      const gain = window.audioCtx.createGain();

      if (type === 'filter') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(1040, now + 0.15);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
      }

      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

      osc.connect(gain);
      gain.connect(window.audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    } catch(e) {}
  };
]]</co>

<co id="⚡-p1" target="T-PYTHON">[[
  /*
  =============================================================================
   GOLEMOTOR STREAM ENGINE & PWA SYSTEM BUS
  =============================================================================
  */

  class GoleStreamEngine {
    constructor() {
      this.canvas = document.getElementById('stream-canvas');
      this.ctx = this.canvas ? this.canvas.getContext('2d', { willReadFrequently: true }) : null;
      this.activeFilter = 'HDR';
      this.state = 'ACTIVE'; // ACTIVE (+), PASSIVE (~), DORMANT (-)
      this.fps = 60;
      this.frameTime = 0;
      this.animTime = 0;
      this.bus = new BroadcastChannel('golemotor_system_bus');

      this.initPwaSystemBridge();
      this.startStreamLoop();
    }

    // 1. PONT PWA & INFLUENCE SYSTÈME INTER-APPS
    initPwaSystemBridge() {
      // Écoute des messages venant d'autres applications/onglets connectés
      this.bus.onmessage = (event) => {
        const { source, action, filter } = event.data;
        const toast = document.getElementById('pwa-toast-msg');
        if (toast) {
          toast.textContent = `📡 [Bus Externe] Signal reçu de ${source} : ${action}`;
        }
        if (action === 'SYNC_FILTER' && filter) {
          this.setFilter(filter, false);
        }
      };

      // Détection automatique de visibilité (Passage Actif ↔ Passif)
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          this.state = 'PASSIVE';
          this.fps = 15; // Économie drastique des calculs en arrière-plan
          this.updateTelemetry('PASSIF (~ REDUCTION)', 'val-passive');
          this.bus.postMessage({ source: 'PWA_TAB_1', action: 'STATE_CHANGED', state: 'PASSIVE' });
        } else {
          this.state = 'ACTIVE';
          this.fps = 60; // Restitution pleine puissance
          this.updateTelemetry('ACTIF (+ EXPANSION)', 'val-active');
          this.bus.postMessage({ source: 'PWA_TAB_1', action: 'STATE_CHANGED', state: 'ACTIVE' });
        }
      });
    }

    updateTelemetry(stateText, stateClass) {
      const stateEl = document.getElementById('telemetry-state');
      if (stateEl) {
        stateEl.textContent = stateText;
        stateEl.className = stateClass;
      }
    }

    setFilter(filterName, broadcast = true) {
      this.activeFilter = filterName;
      const badge = document.getElementById('filter-badge');
      if (badge) badge.textContent = `FILTRE : ${filterName} BOOST`;

      document.querySelectorAll('.btn-filter').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(filterName));
      });

      if (typeof window.jouerSonBoost === 'function') window.jouerSonBoost('filter');

      // Diffusion de la modification aux autres applications via le bus PWA
      if (broadcast) {
        this.bus.postMessage({ source: 'PWA_STREAM_MASTER', action: 'SYNC_FILTER', filter: filterName });
      }
    }

    // 2. MOTEUR DE GÉNÉRATION & DE FILTRAGE DU FLUX
    startStreamLoop() {
      let lastTimestamp = performance.now();

      const render = (now) => {
        const delta = now - lastTimestamp;
        const targetInterval = 1000 / this.fps;

        if (delta >= targetInterval) {
          lastTimestamp = now - (delta % targetInterval);
          this.renderProceduralStream();
          this.applyMatrixFilter();

          // Mesure du FPS
          const fpsEl = document.getElementById('fps-badge');
          if (fpsEl) fpsEl.textContent = `${Math.round(1000 / delta)} FPS`;
        }

        requestAnimationFrame(render);
      };

      requestAnimationFrame(render);
    }

    // Rendu du flux source procédural (Simulation vidéo / caméra)
    renderProceduralStream() {
      if (!this.ctx) return;
      const w = this.canvas.width;
      const h = this.canvas.height;
      this.animTime += 0.03;

      // Fond cybernétique avec grille dynamique
      const grad = this.ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#050B18');
      grad.addColorStop(1, '#1A0028');
      this.ctx.fillStyle = grad;
      this.ctx.fillRect(0, 0, w, h);

      // Sphère d'onde centrale
      const cx = w / 2 + Math.cos(this.animTime) * 80;
      const cy = h / 2 + Math.sin(this.animTime * 1.5) * 40;

      const radial = this.ctx.createRadialGradient(cx, cy, 10, cx, cy, 120);
      radial.addColorStop(0, '#00FFE0');
      radial.addColorStop(0.5, '#7000FF');
      radial.addColorStop(1, 'transparent');

      this.ctx.fillStyle = radial;
      this.ctx.beginPath();
      this.ctx.arc(cx, cy, 120, 0, Math.PI * 2);
      this.ctx.fill();
    }

    // Application des filtres matriciels par pixel
    applyMatrixFilter() {
      if (!this.ctx || this.activeFilter === 'RAW') return;

      const t0 = performance.now();
      const imgData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
      const d = imgData.data;
      const len = d.length;

      if (this.activeFilter === 'HDR') {
        // Boost de contraste, saturation et clarté dynamique
        for (let i = 0; i < len; i += 4) {
          d[i] = Math.min(255, d[i] * 1.25 + 5);         // R
          d[i + 1] = Math.min(255, d[i + 1] * 1.3 + 10); // G
          d[i + 2] = Math.min(255, d[i + 2] * 1.4 + 20); // B
        }
      } else if (this.activeFilter === 'CYBER') {
        // Filtre Cyberpunk haute netteté (Teinte cyan/magenta renforcée)
        for (let i = 0; i < len; i += 4) {
          let lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          d[i] = Math.min(255, d[i] * 1.4 + (lum > 128 ? 40 : 0));
          d[i + 1] = Math.min(255, d[i + 1] * 0.9);
          d[i + 2] = Math.min(255, d[i + 2] * 1.6);
        }
      } else if (this.activeFilter === 'BLOOM') {
        // Seuil d'hyper-luminance luminescente
        for (let i = 0; i < len; i += 4) {
          let maxVal = Math.max(d[i], d[i + 1], d[i + 2]);
          if (maxVal > 160) {
            d[i] = 255;
            d[i + 1] = Math.min(255, d[i + 1] * 1.3);
            d[i + 2] = 255;
          }
        }
      }

      this.ctx.putImageData(imgData, 0, 0);

      const t1 = performance.now();
      const loadEl = document.getElementById('telemetry-load');
      if (loadEl) loadEl.textContent = `${(t1 - t0).toFixed(2)} ms / frame`;
    }
  }

  window.GoleStream = new GoleStreamEngine();
]]</co>
